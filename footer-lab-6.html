<!DOCTYPE html>
<html lang="en" class="pal-charcoal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>footer lab 6 | the close, S3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ---------------------------------------------------------------------------------------------
     S3, refined. The structure the page is converging on:

       upper band   heading left, contact column right
       bottom edge  clock left, copyright centred, back to top right

     The hierarchy is carried by size and ink, not punctuation:

       tier 1   get in touch!               display, primary ink
       tier 2   [ mail | … ]                body x1.2, primary ink          the one action
       tier 3   socials                     body, secondary ink             alternatives to it
       tier 4   clock, copyright, top link  caption (0.8rem), secondary ink  site chrome

     The mail keeps its brackets: `[ … ]` is already this site's device for a prompt or a directive
     ("[ scroll to explore ]", "[ GB | 13:44 ]"), so the address reads as something to act on rather
     than as plain text. Socials stay bare — they're a list, not a prompt.

     The bottom edge is a 3-column grid (1fr auto 1fr) so the copyright is centred on the page axis,
     not on whatever space the clock happens to leave.
     --------------------------------------------------------------------------------------------- */

  :root {
    font-size: clamp(16px, calc(0.625vw + 6px), 22px);

    --surface: #242424;
    --surface-mid: #403b3b;
    --ink: #e8e7e2;
    --ink2: #b0ada6;
    --rose: #cd7a7a;
    --hair: rgba(232, 231, 226, 0.16);

    --gut: 1.5rem;
    --chrome-gut: 1rem;
    --nav: 4.72rem;
    --h: min(13vh, 8rem);
    --body: 0.8rem;
    --caption: 0.75rem;
  }
  @media (min-width: 768px) {
    :root { --gut: 4rem; --chrome-gut: 1.5rem; --body: 1rem; --caption: 0.8rem; }
  }
  @media (min-width: 1280px) { :root { --gut: 5rem; --nav: 6.45rem; } }
  html.h-quiet { --h: 4.4rem; }

  /* compact: the same composition without claiming a whole viewport */
  html.compact .close { min-height: 0; }
  html.compact .mid { flex: 0 1 auto; padding-block: clamp(6rem, 18vh, 12rem); }

  html.pal-cream {
    --surface: #fefbfb; --surface-mid: #e8e7e2;
    --ink: #242424; --ink2: #585858;
    --rose: #dda6a6;
    --hair: rgba(36, 36, 36, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--surface-mid); color: var(--ink);
    font-family: "Roboto Mono", monospace; font-size: var(--body); line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- lab chrome ---------------------------------------------------------------------------- */
  .lab-bar {
    position: sticky; top: 0; z-index: 50;
    display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: baseline;
    padding: 10px var(--gut);
    background: var(--surface-mid); border-bottom: 1px solid var(--hair); font-size: 12.5px;
  }
  .lab-bar label { cursor: pointer; color: var(--ink2); margin-right: 10px; }
  .lab-bar input { accent-color: var(--rose); margin-right: 4px; }
  .lab-bar input:checked + span { color: var(--ink); }
  .lab-bar .name { font-family: Poppins, sans-serif; color: var(--ink); margin-right: auto; }
  .lab-bar .t { color: var(--ink2); }

  /* ---- the close ----------------------------------------------------------------------------- */
  .close {
    display: flex; flex-direction: column;
    min-height: 100dvh;
    background: var(--surface);
    padding-bottom: 1.4rem;
  }
  .wrap { padding-inline: var(--gut); }

  .navrow {
    display: flex; align-items: center; justify-content: space-between;
    height: var(--nav); padding-inline: var(--chrome-gut); flex: none;
  }
  .navrow img { width: 9.4rem; display: block; }
  .navrow .nav-light { display: none; }
  html.pal-cream .navrow .nav-dark { display: none; }
  html.pal-cream .navrow .nav-light { display: block; }
  .navrow ul { display: flex; gap: 1.35rem; list-style: none; font-size: var(--body); }
  .navrow ul a { color: var(--ink2); text-decoration: none; }
  .navrow ul a.on { color: var(--ink); }

  .mid { flex: 1 1 auto; display: flex; align-items: center; }
  /* the heading defines its own track so it can never collide with the links; the right column
     takes the rest */
  .cols { display: grid; grid-template-columns: auto 1fr; gap: 2rem 4rem; align-items: center; width: 100%; }

  h2 {
    font-family: Poppins, sans-serif; font-weight: 400;
    font-size: clamp(2rem, 6.2vw, var(--h));
    line-height: 1.2; letter-spacing: -0.02em; white-space: nowrap;
  }
  .petal { display: inline-block; width: 0.42em; height: 0.48em; margin-left: 0.14em; }
  .petal img { width: 100%; display: block; }

  /* ---- tiers --------------------------------------------------------------------------------- */
  .links { display: flex; flex-direction: column; gap: 0.45rem; }
  .mail { font-size: calc(var(--body) * 1.2); }
  .mail a { color: var(--ink); text-decoration: none; }
  .socials { display: flex; flex-wrap: wrap; gap: 0 1.5rem; }
  .socials a { color: var(--ink2); text-decoration: none; }
  .socials a:hover { color: var(--ink); }

  .meta { font-size: var(--caption); color: var(--ink2); }
  .meta a { color: var(--ink2); text-decoration: none; }
  .clock { white-space: nowrap; }
  .clock b { font-weight: 400; }

  .ul { position: relative; }
  .ul::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 1px;
    background: currentColor; transform: scaleX(0); transform-origin: right;
    transition: transform 0.35s cubic-bezier(0.65, 0, 0.35, 1);
  }
  a.ul:hover::after { transform: scaleX(1); transform-origin: left; }

  /* ---- the bottom edge: clock | copyright | back to top ------------------------------------- */
  .edge {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 0.5rem 1.5rem;
  }
  /* below xl the copyright line is long enough to squeeze the outer cells, so the small print
     steps down one more notch */
  @media (max-width: 1279px) { .edge { font-size: 0.72rem; } }
  .edge .start { justify-self: start; }
  .edge .centre { justify-self: center; text-align: center; }
  .edge .end { justify-self: end; }

  .totop .arrow { width: 0.7em; height: 0.7em; vertical-align: -0.02em; margin-inline: 0.35em; }

  /* ---- small screens: one column, edge stacks ----------------------------------------------- */
  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; gap: 2rem; }
    .mid { align-items: flex-start; padding-top: 8vh; }
    .edge { grid-template-columns: 1fr; gap: 0.35rem; }
    .edge .start, .edge .centre, .edge .end { justify-self: start; text-align: left; }
    /* the real site swaps the nav for a hamburger here; this stands in for that */
    .navrow ul { display: none; }
  }
</style>
</head>
<body>

<div class="lab-bar">
  <span class="name">footer lab 6 · S3</span>
  <span class="t">height</span>
  <label><input type="radio" name="hgt" value="full" checked /><span>full screen</span></label>
  <label><input type="radio" name="hgt" value="compact" /><span>compact</span></label>
  <span class="t">heading</span>
  <label><input type="radio" name="size" value="loud" checked /><span>loud</span></label>
  <label><input type="radio" name="size" value="quiet" /><span>quiet</span></label>
  <span class="t">palette</span>
  <label><input type="radio" name="pal" value="pal-charcoal" checked /><span>charcoal</span></label>
  <label><input type="radio" name="pal" value="pal-cream" /><span>cream</span></label>
</div>

<section class="close" id="s3">
  <div class="navrow">
    <img class="nav-dark" src="public/icons/dark/fulllogodark.svg" alt="fuzzch" />
    <img class="nav-light" src="public/icons/light/fulllogo.svg" alt="fuzzch" />
    <ul>
      <li><a href="#">recents</a></li><li><a href="#">gallery</a></li><li><a href="#">intro</a></li>
      <li><a href="#">about</a></li><li><a class="on" href="#">contact</a></li>
    </ul>
  </div>

  <div class="mid wrap">
    <div class="cols">
      <h2>get in touch!<span class="petal"><img src="public/icons/dark/petaldark.svg" alt="" /></span></h2>

      <div class="links">
        <span class="mail"><a class="ul" href="mailto:fuzz.ch04@gmail.com">[ mail | fuzz.ch04@gmail.com ]</a></span>
        <span class="socials">
          <a class="ul" href="#">linkedin</a>
          <a class="ul" href="#">instagram</a>
          <a class="ul" href="#">artstation</a>
          <a class="ul" href="#">youtube</a>
        </span>
      </div>
    </div>
  </div>

  <div class="edge wrap meta">
    <span class="start clock">[ GB | <b class="tick">12:49:11</b> ]</span>
    <span class="centre">© 2026 — all rights reserved &nbsp;·&nbsp; artwork and website by Fasai Charoensudjai</span>
    <a class="end ul totop" href="#">[ back to top<svg class="arrow" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M5 9V1M1.5 4.5L5 1l3.5 3.5" stroke="currentColor" stroke-width="1.2" /></svg>]</a>
  </div>
</section>

<script>
  const only = new URLSearchParams(location.search).get("v");
  if (only) {
    document.querySelectorAll(".vlabel, .lab-bar").forEach((e) => e.remove());
  }

  const html = document.documentElement;

  document.querySelectorAll('input[name="pal"]').forEach((el) => {
    el.addEventListener("change", () => {
      html.classList.remove("pal-charcoal", "pal-cream");
      html.classList.add(el.value);
    });
  });
  document.querySelectorAll('input[name="size"]').forEach((el) => {
    el.addEventListener("change", () => html.classList.toggle("h-quiet", el.value === "quiet"));
  });
  document.querySelectorAll('input[name="hgt"]').forEach((el) => {
    el.addEventListener("change", () => html.classList.toggle("compact", el.value === "compact"));
  });

  const tick = () => {
    const t = new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London", hour12: false });
    document.querySelectorAll(".tick").forEach((el) => (el.textContent = t));
  };
  tick();
  setInterval(tick, 1000);

  document.querySelector(".totop").addEventListener("click", (e) => {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>
</html>
